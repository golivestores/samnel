name: Auto-patch D3 hydration cache key

# The /collection/D3/ page is regenerated by other tooling from the upstream
# Fluid Glass template, which keeps the stale Storyblok cache key
# }collection/fluid-x-sliding-door. When that key reaches the deployed file,
# Nuxt cannot hydrate the renamed route, falls back to the Storyblok API,
# gets a 404, and renders the 404 page. This workflow restores the correct
# key on every push so the regression cannot stick.

on:
  push:
    branches: [main]
    paths:
      - 'collection/D3/index.html'
      - 'collection/D3/_payload.json'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-d3-fix]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Apply cache key patch if needed
        id: patch
        run: |
          changed=0
          for f in collection/D3/index.html collection/D3/_payload.json; do
            [ -f "$f" ] || continue
            if grep -q '}collection/fluid-x-sliding-door' "$f"; then
              python3 -c "
import sys
fp = '$f'
with open(fp,'r',encoding='utf-8') as fh: s = fh.read()
s = s.replace('}collection/fluid-x-sliding-door', '}collection/D3', 1)
with open(fp,'w',encoding='utf-8') as fh: fh.write(s)
"
              changed=1
              echo "patched $f"
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit and push fix
        if: steps.patch.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection/D3/index.html collection/D3/_payload.json
          git commit -m "Auto-restore D3 hydration cache key [skip-d3-fix]"
          git push
